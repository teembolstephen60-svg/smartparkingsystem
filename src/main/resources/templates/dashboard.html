
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Smart Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2530; --ink-soft: #5b6774; --line: #e2e6ea;
    --surface: #ffffff; --bg: #f6f7f9;
    --brand: #2f6fed; --brand-dark: #1f4fc4;
    --ok: #1a7f4b; --ok-bg: #e6f6ed;
    --warn: #a15c07; --warn-bg: #fdf1de;
    --bad: #a11d1d; --bad-bg: #fbe9e9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, sans-serif; }
  .dashboard-shell { max-width: 1140px; margin: 0 auto; padding: 28px 24px 100px; }
  .dashboard-header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 14px; padding-bottom: 20px; margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }
  .badge {
    width: 38px; height: 38px; border-radius: 8px; background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px;
  }
  .wordmark { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 19px; }
  .wordmark span { color: var(--ink-soft); font-weight: 500; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .user-chip {
    font-size: 13px; color: var(--ink-soft); background: var(--surface);
    border: 1px solid var(--line); padding: 7px 14px; border-radius: 100px;
  }
  .user-chip strong { color: var(--ink); }
  .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); margin-right: 6px; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  h2.section-title {
    font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600;
    letter-spacing: 0.02em; text-transform: uppercase; margin: 0;
  }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
  }
  section { margin-bottom: 36px; }
  .search-box {
    font-family: 'Inter', sans-serif; font-size: 13px; padding: 7px 12px;
    border: 1px solid var(--line); border-radius: 8px; width: 200px; color: var(--ink);
  }
  .search-box:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 36px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; border-left: 3px solid var(--brand); }
  .card .num { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; line-height: 1; }
  .card .label { margin-top: 6px; font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; background: #fafbfc; color: var(--ink-soft); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; padding: 11px 16px; border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 11px 16px; font-size: 14px; border-bottom: 1px solid #f0f1f3; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafbfc; }
  .pill { display: inline-block; padding: 3px 11px; border-radius: 100px; font-size: 12px; font-weight: 600; }
  .pill.admin { background: var(--warn-bg); color: var(--warn); }
  .pill.user  { background: #eef0f2; color: var(--ink-soft); }
  .pill.free  { background: var(--ok-bg); color: var(--ok); }
  .pill.occupied { background: var(--warn-bg); color: var(--warn); }
  .pill.other { background: var(--bad-bg); color: var(--bad); }
  .empty, .error { padding: 28px; text-align: center; font-size: 14px; color: var(--ink-soft); }
  .error { color: var(--bad); }
  .zone-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; padding: 18px; }
  .space-tile {
    aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); cursor: pointer; transition: transform 0.1s ease;
  }
  .space-tile:hover { transform: translateY(-2px); }
  .space-tile .zone { font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 400; color: var(--ink-soft); margin-top: 2px; }
  .space-tile.free { background: var(--ok-bg); border-color: #bfe6cf; color: var(--ok); }
  .space-tile.occupied { background: var(--warn-bg); border-color: #f2d9a8; color: var(--warn); }
  .space-tile.other { background: var(--bad-bg); border-color: #f0c2c2; color: var(--bad); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-soft); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .role-select {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; padding: 4px 8px;
    border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; padding: 5px 12px;
    border-radius: 6px; border: 1px solid var(--bad); background: var(--bad-bg); color: var(--bad); cursor: pointer;
  }
  .btn:hover { background: var(--bad); color: #fff; }
  .overlay {
    position: fixed; inset: 0; background: rgba(28,37,48,0.45);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 12px; max-width: 460px; width: 100%;
    max-height: 80vh; overflow-y: auto; padding: 22px 24px;
  }
  .modal h3 { font-family: 'Oswald', sans-serif; margin: 0 0 4px; font-size: 18px; }
  .modal .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
  .modal-row { padding: 10px 0; border-bottom: 1px solid #f0f1f3; font-size: 13px; }
  .modal-row:last-child { border-bottom: none; }
  .modal-close {
    margin-top: 16px; font-size: 13px; font-weight: 600; color: var(--brand);
    background: none; border: none; cursor: pointer; padding: 0;
  }
</style>
</head>
<body>
<div class="dashboard-shell">
  <div class="dashboard-header">
    <div class="header-left">
      <div class="badge">P</div>
      <div class="wordmark">Smart Parking<span> Management System</span></div>
    </div>
    <div class="user-chip"><span class="live-dot"></span>Signed in as <strong>Admin</strong></div>
  </div>
  <div class="summary" id="summaryBoard">
    <div class="card"><div class="num" id="spaceCount">—</div><div class="label">Spaces</div></div>
    <div class="card"><div class="num" id="userCount">—</div><div class="label">Users</div></div>
    <div class="card"><div class="num" id="bookingCount">—</div><div class="label">Bookings</div></div>
  </div>
  <section>
    <div class="section-head"><h2 class="section-title">Parking Spaces</h2></div>
    <div class="panel"><div id="zoneMap" class="zone-map"><div class="empty">Loading…</div></div></div>
    <div class="legend">
      <span><span class="swatch" style="background:var(--ok)"></span>Free</span>
      <span><span class="swatch" style="background:var(--warn)"></span>Occupied</span>
      <span><span class="swatch" style="background:var(--bad)"></span>Other</span>
    </div>
  </section>
  <section>
    <div class="section-head">
      <h2 class="section-title">Bookings</h2>
      <input class="search-box" id="bookingSearch" placeholder="Search bookings…" oninput="filterAndRenderBookings()">
    </div>
    <div class="panel"><div id="bookingsTable"><div class="empty">Loading…</div></div></div>
  </section>
  <section>
    <div class="section-head">
      <h2 class="section-title">Users</h2>
      <input class="search-box" id="userSearch" placeholder="Search users…" oninput="filterAndRenderUsers()">
    </div>
    <div class="panel"><div id="usersTable"><div class="empty">Loading…</div></div></div>
  </section>
</div>
<div class="overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
<script>
  let allBookings = [];
  let allUsers = [];
  let allSpaces = [];
  function findIdKey(sample, prefix) {
    const keys = Object.keys(sample);
    return keys.find(k => new RegExp(prefix + '.*id', 'i').test(k))
        || keys.find(k => /^id$/i.test(k))
        || keys.find(k => /id/i.test(k));
  }
  function findKey(obj, needle) {
    return Object.keys(obj).find(k => k.toLowerCase().includes(needle));
  }
  function humanizeKey(key) {
    return key.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }
  async function getJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url} returned ${res.status}`);
    return res.json();
  }
  function classifyStatus(status) {
    const s = (status || '').toString().toLowerCase();
    if (s.includes('free') || s.includes('available') || s.includes('open')) return 'free';
    if (s.includes('occup') || s.includes('taken') || s.includes('reserved')) return 'occupied';
    return 'other';
  }
  // ---- summary ----
  async function loadSummary() {
    try {
      const data = await getJSON('/admin/summary');
      document.getElementById('spaceCount').textContent = data[findKey(data, 'space')] ?? '—';
      document.getElementById('userCount').textContent = data[findKey(data, 'user')] ?? '—';
      document.getElementById('bookingCount').textContent = data[findKey(data, 'booking')] ?? '—';
    } catch (e) {
      document.getElementById('summaryBoard').innerHTML = `<div class="error">Could not load /admin/summary — ${e.message}</div>`;
    }
  }
  // ---- zone map + click-to-inspect ----
  async function loadSpaces() {
    const container = document.getElementById('zoneMap');
    try {
      allSpaces = await getJSON('/admin/spaces');
      if (!allSpaces.length) { container.innerHTML = '<div class="empty">No parking spaces found.</div>'; return; }
      const sample = allSpaces[0];
      const idKey = findIdKey(sample, 'space');
      const zoneKey = findKey(sample, 'zone');
      const statusKey = findKey(sample, 'status');
      container.innerHTML = allSpaces.map(sp => {
        const cls = classifyStatus(sp[statusKey]);
        const zone = zoneKey ? sp[zoneKey] : '';
        const id = sp[idKey] ?? '?';
        return `<div class="space-tile ${cls}" title="${sp[statusKey] || ''}" onclick="showSpaceHistory('${id}')">
                  <div>${id}</div>
                  ${zone ? `<div class="zone">${zone}</div>` : ''}
                </div>`;
      }).join('');
    } catch (e) {
      container.innerHTML = `<div class="error">Could not load /admin/spaces — ${e.message}</div>`;
    }
  }
  function showSpaceHistory(spaceId) {
    const spaceSample = allSpaces[0] || {};
    const spaceIdKey = findIdKey(spaceSample, 'space');
    const statusKey = findKey(spaceSample, 'status');
    const zoneKey = findKey(spaceSample, 'zone');
    const space = allSpaces.find(s => String(s[spaceIdKey]) === String(spaceId));
    const bSample = allBookings[0] || {};
    const bSpaceKey = findKey(bSample, 'space');
    const bIdKey = findIdKey(bSample, 'booking');
    const bTimeKey = findKey(bSample, 'time');
    const bStatusKey = findKey(bSample, 'status');
    const bUserKey = findKey(bSample, 'user');
    const history = allBookings.filter(b => String(b[bSpaceKey]) === String(spaceId));
    const rows = history.length
      ? history.map(b => `<div class="modal-row"><strong>#${b[bIdKey]}</strong> — ${b[bTimeKey] || ''} — ${b[bStatusKey] || ''} — user ${b[bUserKey] ?? ''}</div>`).join('')
      : '<div class="modal-row">No bookings recorded for this space.</div>';
    document.getElementById('modalBody').innerHTML = `
      <h3>Space ${spaceId}</h3>
      <div class="sub">${space ? `Zone ${space[zoneKey] || '—'} · ${space[statusKey] || '—'}` : ''}</div>
      ${rows}
      <button class="modal-close" onclick="closeModal()">Close</button>
    `;
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
  // ---- bookings table + search + cancel ----
  function renderBookingsTable(rows) {
    const target = document.getElementById('bookingsTable');
    if (!rows.length) { target.innerHTML = '<div class="empty">No matching bookings.</div>'; return; }
    const keys = Object.keys(rows[0]);
    const idKey = findIdKey(rows[0], 'booking');
    const head = keys.map(k => `<th>${humanizeKey(k)}</th>`).join('') + '<th>Actions</th>';
    const body = rows.map(row => {
      const cells = keys.map(k => {
        let val = row[k];
        if (val === null || val === undefined) val = '—';
        if (typeof val === 'object') val = JSON.stringify(val);
        return `<td>${val}</td>`;
      }).join('');
      return `<tr><td colspan="0"></td>`.replace('<td colspan="0"></td>', '') +
        `<tr>${cells}<td><button class="btn" onclick="cancelBooking('${row[idKey]}')">Cancel</button></td></tr>`;
    }).join('');
    target.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  }
  function filterAndRenderBookings() {
    const q = document.getElementById('bookingSearch').value.toLowerCase();
    const filtered = !q ? allBookings : allBookings.filter(row =>
      Object.values(row).some(v => String(v ?? '').toLowerCase().includes(q))
    );
    renderBookingsTable(filtered);
  }
  async function cancelBooking(id) {
    if (!confirm(`Cancel booking #${id}? This can't be undone.`)) return;
    try {
      const res = await fetch(`/admin/bookings/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      await loadBookings();
      await loadSummary();
      await loadSpaces();
    } catch (e) {
      alert(`Could not cancel booking: ${e.message}. If this is a 403, CSRF protection is likely blocking it — check SecurityConfig.`);
    }
  }
  async function loadBookings() {
    try {
      allBookings = await getJSON('/admin/bookings');
      filterAndRenderBookings();
    } catch (e) {
      document.getElementById('bookingsTable').innerHTML = `<div class="error">Could not load /admin/bookings — ${e.message}</div>`;
    }
  }
  // ---- users table + search + role change ----
  function renderUsersTable(rows) {
    const target = document.getElementById('usersTable');
    if (!rows.length) { target.innerHTML = '<div class="empty">No matching users.</div>'; return; }
    const sample = rows[0];
    const keys = Object.keys(sample);
    const roleKey = findKey(sample, 'role');
    const idKey = findIdKey(sample, '');
    const head = keys.map(k => `<th>${humanizeKey(k)}</th>`).join('');
    const body = rows.map(row => {
      const cells = keys.map(k => {
        if (k === roleKey) {
          const current = (row[k] || '').toString().toUpperCase();
          return `<td>
            <select class="role-select" onchange="updateRole('${row[idKey]}', this.value)">
              <option value="USER" ${current === 'USER' ? 'selected' : ''}>USER</option>
              <option value="ADMIN" ${current === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
            </select>
          </td>`;
        }
        let val = row[k];
        if (val === null || val === undefined) val = '—';
        return `<td>${val}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    target.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  }
  function filterAndRenderUsers() {
    const q = document.getElementById('userSearch').value.toLowerCase();
    const filtered = !q ? allUsers : allUsers.filter(row =>
      Object.values(row).some(v => String(v ?? '').toLowerCase().includes(q))
    );
    renderUsersTable(filtered);
  }
  async function updateRole(id, role) {
    try {
      const res = await fetch(`/admin/users/${id}/role`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role })
      });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      await loadUsers();
    } catch (e) {
      alert(`Could not update role: ${e.message}. If this is a 403, CSRF protection is likely blocking it — check SecurityConfig.`);
    }
  }
  async function loadUsers() {
    try {
      allUsers = await getJSON('/admin/users');
      filterAndRenderUsers();
    } catch (e) {
      document.getElementById('usersTable').innerHTML = `<div class="error">Could not load /admin/users — ${e.message}</div>`;
    }
  }
  // ---- initial load + light auto-refresh ----
  loadSummary();
  loadSpaces();
  loadBookings();
  loadUsers();
  // Refresh live status every 20s without disrupting search/edits in progress
  setInterval(() => {
    loadSummary();
    loadSpaces();
  }, 20000);
</script>
</body>
</html>
